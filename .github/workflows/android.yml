name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept SDK licenses and install Android packages
        run: |
          yes | sdkmanager --sdk_root=${ANDROID_SDK_ROOT} --licenses >/dev/null
          sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Download ONNX INT8 model bundle (~323 MB)
        run: |
          mkdir -p android_tts/app/src/main/assets/onnx-int8
          cd android_tts/app/src/main/assets/onnx-int8
          for f in encoder.onnx prosody.onnx decoder_window.onnx source.onnx holos_onnx.json voices.npz; do
            curl -fsSL --retry 3 -o "$f" "https://huggingface.co/patriotyk/HolosTTS/resolve/main/onnx-int8/$f?download=true"
          done

      - name: Assemble Debug APK
        working-directory: android_tts
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HolosTTS-debug-apk
          path: android_tts/app/build/outputs/apk/debug/*.apk
          retention-days: 7
