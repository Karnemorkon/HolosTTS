name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p /opt/android-sdk/cmdline-tools
          cd /opt/android-sdk/cmdline-tools
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept SDK licenses and install packages
        run: |
          yes | sdkmanager --sdk_root=/opt/android-sdk --licenses >/dev/null
          sdkmanager --sdk_root=/opt/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Download ONNX INT8 model bundle (~323 MB)
        run: |
          mkdir -p android_tts/app/src/main/assets
          cd android_tts/app/src/main/assets
          for f in encoder.onnx prosody.onnx decoder_window.onnx source.onnx holos_onnx.json voices.npz; do
            curl -fsSL --retry 3 -o "$f" "https://huggingface.co/patriotyk/HolosTTS/resolve/main/onnx-int8/$f?download=true"
          done

      - name: Assemble Debug APK
        working-directory: android_tts
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HolosTTS-debug-apk
          path: android_tts/app/build/outputs/apk/debug/*.apk
          retention-days: 7
