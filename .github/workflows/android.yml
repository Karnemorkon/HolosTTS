name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools: latest
          platforms: [34]
          build-tools: [34.0.0]

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Download ONNX INT8 model bundle
        run: |
          mkdir -p android_tts/app/src/main/assets/onnx-int8
          cd android_tts/app/src/main/assets/onnx-int8
          for f in encoder.onnx prosody.onnx decoder_window.onnx source.onnx holos_onnx.json voices.npz; do
            curl -fsSL -o "$f" "https://huggingface.co/patriotyk/HolosTTS/resolve/main/onnx-int8/$f?download=true"
          done

      - name: Assemble Debug APK
        working-directory: android_tts
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HolosTTS-debug-apk
          path: android_tts/app/build/outputs/apk/debug/*.apk
